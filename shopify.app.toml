# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Bundle Safety"
client_id = "e2da9638eba3325b99d27d1b3e07c7d8"
application_url = "https://stocksentry.tidyflowapp.com"
embedded = true

[access_scopes]
scopes = "read_inventory,read_products,read_locations"

[auth]
redirect_urls = [
  "https://stocksentry.tidyflowapp.com/auth",
  "https://stocksentry.tidyflowapp.com/auth/callback",
  "https://stocksentry.tidyflowapp.com/api/auth",
  "https://stocksentry.tidyflowapp.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update", "inventory_levels/connect", "inventory_levels/disconnect" ]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "products/update", "products/delete" ]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/shopify"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
